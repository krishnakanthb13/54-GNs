<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Droplet Shape -->
  <path d="M 64,8 C 62,26 18,54 18,84 A 46,46 0 0 0 110,84 C 110,54 66,26 64,8 Z" 
        fill="url(#dropGrad)" 
        filter="url(#subtleShadow)" />
  <!-- Gloss highlight -->
  <path d="M 62,20 C 52,40 34,60 36,88 C 44,66 60,46 62,20 Z" 
        fill="url(#highlightGrad)" />
  <!-- Small secondary reflection -->
  <ellipse cx="78" cy="92" rx="9" ry="6" fill="#ffffff" opacity="0.4" />
</svg>
